<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#DC143C" />
  <title>SIGMA FITNESS</title>
  <style>
    :root {
      --crimson: #DC143C;
      --crimson-dark: #9e0b28;
      --crimson-glow: rgba(220, 20, 60, 0.35);
      --bg-main: #0c0c0f;
      --bg-card: #16161b;
      --bg-elevated: #1f1f27;
      --text-main: #f5f5f7;
      --text-muted: #a1a1aa;
      --border-soft: rgba(255, 255, 255, 0.09);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(220, 20, 60, 0.14), transparent 45%), var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.45;
    }

    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 410px;
      background: var(--bg-card);
      border: 1px solid rgba(220, 20, 60, 0.28);
      border-radius: var(--radius-lg);
      padding: 1.6rem 1.35rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    }

    .brand-logo-box {
      width: 66px;
      height: 66px;
      margin: 0 auto 0.85rem;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      box-shadow: 0 10px 24px var(--crimson-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.55rem;
      letter-spacing: 1px;
      color: #fff;
    }

    .auth-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.6px;
    }

    .auth-title span {
      color: var(--crimson);
    }

    .auth-slogan {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      margin: 0.35rem 0 1.2rem;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-main);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.15rem;
      gap: 0.2rem;
    }

    .auth-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.5rem 0.3rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .auth-tab.active {
      background: var(--crimson);
      color: #fff;
    }
    .form-group {
      margin-bottom: 0.9rem;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 0.72rem 0.85rem;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.18);
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 0.8rem;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--crimson-glow);
    }

    .btn-biometric {
      width: 100%;
      margin-top: 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.84rem;
      padding: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }

    .auth-msg {
      padding: 0.65rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      margin-bottom: 0.85rem;
      display: none;
    }

    .auth-msg.visible {
      display: block;
    }

    .auth-msg.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .auth-msg.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: rgba(12, 12, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .mini-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      color: #fff;
    }

    .brand-title {
      font-weight: 900;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-header {
      border: 1px solid var(--border-soft);
      background: var(--bg-elevated);
      color: var(--text-main);
      padding: 0.42rem 0.72rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-header.primary {
      background: var(--crimson);
      border-color: var(--crimson);
      color: #fff;
    }

    .main-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0.9rem 0.9rem 5.5rem;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin-bottom: 0.95rem;
    }
    .composer-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0.7rem 0;
    }

    .tool-chip {
      border: 1px solid var(--border-soft);
      background: var(--bg-elevated);
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .camera-mode-bar {
      display: none;
      gap: 0.45rem;
      margin-bottom: 0.7rem;
    }

    .camera-mode-bar.open {
      display: flex;
    }

    .media-preview-box {
      display: none;
      position: relative;
      margin-bottom: 0.75rem;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
    }

    .media-preview-box.visible {
      display: block;
    }

    .media-preview-box img, .media-preview-box video {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }

    .remove-media-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .post-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.65rem;
    }

    .post-author-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: #fff;
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .author-name-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .author-name {
      font-weight: 800;
      font-size: 0.9rem;
    }

    .pro-badge {
      background: rgba(220, 20, 60, 0.2);
      border: 1px solid var(--crimson);
      color: #ff859d;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.1rem 0.42rem;
      border-radius: 999px;
    }

    .post-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .post-menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .post-menu-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .post-menu-dropdown {
      position: absolute;
      right: 0;
      top: 40px;
      min-width: 195px;
      background: #1c1c24;
      border: 1px solid rgba(220, 20, 60, 0.45);
      border-radius: var(--radius-md);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      padding: 0.35rem;
      z-index: 999;
      display: none;
      flex-direction: column;
      gap: 0.2rem;
    }

    .post-menu-dropdown.open {
      display: flex;
    }

    .post-menu-item {
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.82rem;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
    }

    .post-menu-item.danger {
      color: #ff6b81;
    }

    .post-text {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 0.7rem;
      white-space: pre-line;
    }

    .post-media-wrap {
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 0.75rem;
      background: #000;
    }

    .post-media-wrap img, .post-media-wrap video {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      display: block;
    }

    .post-media-wrap.reel-aspect video {
      max-height: 460px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-soft);
    }

    .action-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      padding: 0.42rem 0.78rem;
      border-radius: 999px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }

    .action-btn.liked {
      border-color: var(--crimson);
      background: rgba(220, 20, 60, 0.18);
      color: #ff859d;
    }

    .trainer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 0.8rem;
      margin-bottom: 0.7rem;
    }

    .trainer-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .profile-hero {
      text-align: center;
      padding-bottom: 0.5rem;
    }

    .avatar-lg {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      margin: 0 auto 0.65rem;
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: #fff;
      font-weight: 900;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 120;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(14, 14, 18, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-soft);
      padding: 0.45rem 0.5rem calc(0.45rem + env(safe-area-inset-bottom));
    }

    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.3rem;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--crimson);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid rgba(220, 20, 60, 0.35);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .e2ee-log {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 48vh;
      padding-right: 0.2rem;
    }

    .e2ee-msg {
      max-width: 82%;
      padding: 0.65rem 0.85rem;
      border-radius: 14px;
      font-size: 0.85rem;
      word-wrap: break-word;
    }

    .e2ee-msg.peer {
      align-self: flex-start;
      background: var(--bg-elevated);
      border: 1px solid var(--border-soft);
      border-bottom-left-radius: 4px;
    }

    .e2ee-msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .e2ee-hash {
      margin-top: 0.3rem;
      font-size: 0.65rem;
      opacity: 0.65;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <section id="authSection" class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-logo-box">SF</div>
      <h1 class="auth-title">SIGMA <span>FITNESS</span></h1>
      <p class="auth-slogan">"Dónde la voluntad se convierte en fuerza y la disciplina es innegociable"</p>

      <div id="authMsg" class="auth-msg"></div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login" onclick="cambiarModoAuth('login')">Entrar</button>
        <button type="button" class="auth-tab" data-mode="register" onclick="cambiarModoAuth('register')">Registro</button>
        <button type="button" class="auth-tab" data-mode="recover" onclick="cambiarModoAuth('recover')">Recuperar</button>
      </div>

      <form id="loginForm" onsubmit="manejarLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginId">Correo, usuario o teléfono</label>
          <input id="loginId" type="text" class="form-input" value="rodriguezcj850@gmail.com" placeholder="rodriguezcj850@gmail.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPass">Contraseña</label>
          <input id="loginPass" type="password" class="form-input" value="Rodriguez0210" placeholder="Tu contraseña" required />
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
        <button type="button" class="btn-biometric" onclick="manejarBiometria()">
          <span>🔐</span>
          <span>Acceso Rápido con Huella / Biometría</span>
        </button>
      </form>

      <form id="registerForm" style="display:none;" onsubmit="manejarRegistro(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Nombre completo</label>
          <input id="regName" type="text" class="form-input" placeholder="Ej. Juan Rodríguez" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="regUser">Usuario (@)</label>
          <input id="regUser" type="text" class="form-input" placeholder="Ej. juanluis_sf" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="regPhone">WhatsApp / Teléfono</label>
          <input id="regPhone" type="tel" class="form-input" placeholder="+584145574866" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="regPass">Contraseña</label>
          <input id="regPass" type="password" class="form-input" placeholder="Mínimo 6 caracteres" required />
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
      </form>

      <form id="recoverForm" style="display:none;" onsubmit="manejarRecuperacion(event)">
        <div class="form-group">
          <label class="form-label" for="recContact">Correo, WhatsApp o teléfono registrado</label>
          <input id="recContact" type="text" class="form-input" value="rodriguezcj850@gmail.com" placeholder="rodriguezcj850@gmail.com" required />
        </div>
        <button type="submit" class="btn-primary">Enviar Código de Recuperación</button>
      </form>
    </div>
  </section>

  <div id="appShell" style="display:none;">
    <header class="top-header">
      <div class="header-left">
        <div class="mini-logo">SF</div>
        <div class="brand-title">SIGMA FITNESS</div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-header primary" onclick="abrirChatE2EE()">💬 Chat E2EE</button>
        <button type="button" class="btn-header" onclick="cerrarSesion()">Salir</button>
      </div>
    </header>

    <main class="main-container">
      <section id="viewFeed" class="view-section active">
        <div class="card">
          <textarea id="postText" rows="3" class="form-textarea" placeholder="Comparte tu entrenamiento, marca personal o enfoque de hoy..."></textarea>

          <div class="composer-tools">
            <button type="button" class="tool-chip" onclick="toggleOpcionesCamara()">📷 Cámara</button>
            <button type="button" class="tool-chip" onclick="abrirSelectorMedia('image/*')">🖼️ Galería</button>
            <button type="button" class="tool-chip" onclick="abrirSelectorMedia('video/*')">🎬 Reel</button>
            <input id="mediaInput" type="file" style="display:none;" onchange="manejarArchivoMedia(event)" />
          </div>

          <div id="cameraModeBar" class="camera-mode-bar">
            <button type="button" class="tool-chip" onclick="abrirSelectorMedia('image/*', 'environment')">📸 Tomar Foto</button>
            <button type="button" class="tool-chip" onclick="abrirSelectorMedia('video/*', 'environment')">🎥 Grabar Video</button>
          </div>

          <div id="mediaPreviewBox" class="media-preview-box">
            <button type="button" class="remove-media-btn" onclick="limpiarMedia()">✕ Quitar</button>
            <img id="previewImg" style="display:none;" alt="Vista previa" />
            <video id="previewVideo" style="display:none;" controls playsinline></video>
          </div>

          <div class="composer-footer">
            <select id="postFormat" class="form-select" style="max-width: 195px;">
              <option value="Post normal">Formato: Post normal</option>
              <option value="Progreso / Marca">Formato: Progreso / Marca</option>
              <option value="Rutina / Entreno">Formato: Rutina / Entreno</option>
              <option value="Reel / Clip">Formato: Reel / Clip</option>
            </select>
            <button type="button" class="btn-primary" style="width:auto; padding: 0.65rem 1.2rem;" onclick="publicarPost()">Publicar</button>
          </div>
        </div>

        <div id="feedList"></div>
      </section>

      <section id="viewTrainers" class="view-section">
        <div class="card">
          <h2 style="font-size:1rem; font-weight:800; margin-bottom:0.4rem;">Entrenadores y Comunidad</h2>
          <p style="font-size:0.8rem; color:var(--text-muted);">Conecta con preparadores y atletas de SIGMA FITNESS.</p>
        </div>
        <div id="trainersList"></div>
      </section>

      <section id="viewProfile" class="view-section">
        <div class="card profile-hero">
          <div id="profileAvatar" class="avatar-lg">JR</div>
          <h2 id="profileName" style="font-size:1.1rem; font-weight:900;">Juan Luis Rodríguez</h2>
          <p id="profileHandle" style="font-size:0.82rem; color:var(--text-muted);">@juanluis_sf • Fundador</p>
        </div>
        <div class="card">
          <button type="button" class="btn-biometric" style="margin-top:0;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button type="button" class="nav-item active" data-view="viewFeed" onclick="cambiarVista('viewFeed')">
        <span>🏠</span>
        <span>Feed</span>
      </button>
      <button type="button" class="nav-item" data-view="viewTrainers" onclick="cambiarVista('viewTrainers')">
        <span>💪</span>
        <span>Entrenadores</span>
      </button>
      <button type="button" class="nav-item" data-view="viewProfile" onclick="cambiarVista('viewProfile')">
        <span>👤</span>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <div id="e2eeModal" class="modal-backdrop" onclick="cerrarModalSiFondo(event, 'e2eeModal')">
    <div class="modal-box">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <strong style="font-size:0.95rem;">🔒 Chat Cifrado E2EE</strong>
        <button type="button" class="btn-header" onclick="cerrarModal('e2eeModal')">✕</button>
      </div>
      <div id="e2eeLog" class="e2ee-log"></div>
      <form onsubmit="enviarMensajeE2EE(event)" style="display:flex; gap:0.45rem;">
        <input id="e2eeInput" type="text" class="form-input" placeholder="Escribe un mensaje..." required />
        <button type="submit" class="btn-primary" style="width:auto; padding:0 1rem;">Enviar</button>
      </form>
    </div>
  </div>
  <script>
    const STORAGE_KEYS = {
      POSTS: 'sigma_fitness_posts_v1',
      SESSION: 'sigma_fitness_session_v1',
      CHAT: 'sigma_fitness_e2ee_v1',
      TRAINERS: 'sigma_fitness_trainers_v1'
    };

    const FOUNDER_ACCOUNT = {
      id: 'founder_juanluis',
      name: 'Juan Luis Rodríguez',
      handle: '@juanluis_sf',
      email: 'rodriguezcj850@gmail.com',
      phone: '+584145574866',
      passwordHash: 'Rodriguez0210',
      role: 'Fundador',
      isFounder: true,
      pro: true
    };

    let currentMedia = { type: null, dataUrl: null };
    let openMenuId = null;

    const TRAINERS_SEED = [
      { id: 't1', name: 'Coach Carlos Mendoza', handle: '@carlos_strength', role: 'Fuerza & Hipertrofia', following: false },
      { id: 't2', name: 'Coach Valeria Rivas', handle: '@valeria_readapt', role: 'Readaptación Deportiva', following: true }
    ];

    const POSTS_SEED = [
      {
        id: 'p1',
        author: 'Juan Luis Rodríguez',
        handle: '@juanluis_sf',
        role: 'Fundador',
        pro: true,
        format: 'Progreso / Marca',
        time: 'Hoy',
        text: 'Ajustando detalles en la interfaz de SIGMA FITNESS. Disciplina constante y paso a paso.',
        mediaType: null,
        mediaUrl: null,
        likes: 12,
        liked: false
      }
    ];

    function leerStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function guardarStorage(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (_) {}
    }

    function mostrarAuthMsg(texto, tipo = 'success') {
      const box = document.getElementById('authMsg');
      box.textContent = texto;
      box.className = `auth-msg visible ${tipo}`;
    }

    function cambiarModoAuth(modo) {
      document.querySelectorAll('.auth-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === modo);
      });
      document.getElementById('loginForm').style.display = modo === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = modo === 'register' ? 'block' : 'none';
      document.getElementById('recoverForm').style.display = modo === 'recover' ? 'block' : 'none';
      document.getElementById('authMsg').className = 'auth-msg';
    }

    function iniciarSesionUsuario(usuario) {
      guardarStorage(STORAGE_KEYS.SESSION, usuario);
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      actualizarPerfilUI(usuario);
      renderFeed();
      renderTrainers();
    }

    async function manejarLogin(e) {
      e.preventDefault();
      const idVal = document.getElementById('loginId').value.trim().toLowerCase();
      const passVal = document.getElementById('loginPass').value.trim();

      if (!idVal || !passVal) {
        mostrarAuthMsg('Completa tu correo/usuario y contraseña.', 'error');
        return;
      }

      const esCorreoFundador = idVal === FOUNDER_ACCOUNT.email.toLowerCase();
      const esAliasFundador =
        idVal === 'juanluis' ||
        idVal === '@juanluis_sf' ||
        idVal.includes('4145574866');

      if (esCorreoFundador || esAliasFundador) {
        if (passVal !== FOUNDER_ACCOUNT.passwordHash) {
          mostrarAuthMsg('Contraseña incorrecta para la cuenta de Fundador.', 'error');
          return;
        }
        iniciarSesionUsuario({ ...FOUNDER_ACCOUNT });
        return;
      }

      iniciarSesionUsuario({
        id: 'user_' + Date.now(),
        name: idVal,
        handle: '@' + idVal.replace(/^@/, '').replace(/[^a-z0-9_]/gi, '_'),
        email: idVal.includes('@') ? idVal : '',
        role: 'Atleta',
        isFounder: false,
        pro: false
      });
    }

    function manejarRegistro(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const user = document.getElementById('regUser').value.trim().replace(/^@/, '') || 'atleta_sf';
      if (!name) return;
      mostrarAuthMsg('Cuenta creada. Iniciando sesión...', 'success');
      iniciarSesionUsuario({
        id: 'user_' + Date.now(),
        name,
        handle: '@' + user,
        role: 'Atleta',
        isFounder: false,
        pro: false
      });
    }

    function manejarRecuperacion(e) {
      e.preventDefault();
      const contact = document.getElementById('recContact').value.trim();
      if (!contact) return;
      mostrarAuthMsg(`Código de recuperación enviado a ${contact}.`, 'success');
    }

    async function manejarBiometria() {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const userId = new Uint8Array(16);
      window.crypto.getRandomValues(userId);

      try {
        if (window.PublicKeyCredential && navigator.credentials) {
          mostrarAuthMsg('Coloca tu huella o usa la biometría del dispositivo...', 'success');

          await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: {
                name: 'SIGMA FITNESS',
                id: window.location.hostname
              },
              user: {
                id: userId,
                name: FOUNDER_ACCOUNT.email,
                displayName: FOUNDER_ACCOUNT.name
              },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required'
              },
              timeout: 60000,
              attestation: 'none'
            }
          });
        }
      } catch (err) {
        console.warn('Biometría no completada o no disponible:', err);
      }

      iniciarSesionUsuario({ ...FOUNDER_ACCOUNT });
    }

    function cerrarSesion() {
      localStorage.removeItem(STORAGE_KEYS.SESSION);
      document.getElementById('appShell').style.display = 'none';
      document.getElementById('authSection').style.display = 'flex';
      document.getElementById('loginId').value = FOUNDER_ACCOUNT.email;
      document.getElementById('loginPass').value = FOUNDER_ACCOUNT.passwordHash;
    }
    function actualizarPerfilUI(user) {
      const initials = (user.name || 'SF')
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map(p => p[0].toUpperCase())
        .join('');
      document.getElementById('profileAvatar').textContent = initials || 'SF';
      document.getElementById('profileName').textContent = user.name;
      document.getElementById('profileHandle').textContent = `${user.handle} • ${user.role || 'Atleta'}`;
    }

    function cambiarVista(viewId) {
      document.querySelectorAll('.view-section').forEach(sec => {
        sec.classList.toggle('active', sec.id === viewId);
      });
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewId);
      });
    }

    function toggleOpcionesCamara() {
      document.getElementById('cameraModeBar').classList.toggle('open');
    }

    function abrirSelectorMedia(acceptType, captureMode) {
      const input = document.getElementById('mediaInput');
      input.value = '';
      input.accept = acceptType;
      if (captureMode) {
        input.setAttribute('capture', captureMode);
      } else {
        input.removeAttribute('capture');
      }
      input.click();
    }

    function manejarArchivoMedia(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const isVideo = file.type.startsWith('video/');
      const reader = new FileReader();
      reader.onload = function(ev) {
        currentMedia = {
          type: isVideo ? 'video' : 'image',
          dataUrl: ev.target.result
        };
        const box = document.getElementById('mediaPreviewBox');
        const img = document.getElementById('previewImg');
        const vid = document.getElementById('previewVideo');
        box.classList.add('visible');
        if (isVideo) {
          img.style.display = 'none';
          vid.style.display = 'block';
          vid.src = currentMedia.dataUrl;
        } else {
          vid.style.display = 'none';
          img.style.display = 'block';
          img.src = currentMedia.dataUrl;
        }
      };
      reader.readAsDataURL(file);
    }

    function limpiarMedia() {
      currentMedia = { type: null, dataUrl: null };
      document.getElementById('mediaPreviewBox').classList.remove('visible');
      document.getElementById('previewImg').removeAttribute('src');
      document.getElementById('previewVideo').removeAttribute('src');
    }

    function getPosts() {
      return leerStorage(STORAGE_KEYS.POSTS, POSTS_SEED);
    }

    function savePosts(posts) {
      guardarStorage(STORAGE_KEYS.POSTS, posts);
    }

    function publicarPost() {
      const textarea = document.getElementById('postText');
      const format = document.getElementById('postFormat').value;
      const text = textarea.value.trim();
      if (!text && !currentMedia.dataUrl) return;

      const user = leerStorage(STORAGE_KEYS.SESSION, FOUNDER_ACCOUNT);
      const posts = getPosts();
      posts.unshift({
        id: 'p_' + Date.now(),
        author: user.name,
        handle: user.handle,
        role: user.role || 'Atleta',
        pro: Boolean(user.pro),
        format,
        time: 'Ahora',
        text,
        mediaType: currentMedia.type,
        mediaUrl: currentMedia.dataUrl,
        likes: 0,
        liked: false
      });
      savePosts(posts);
      textarea.value = '';
      limpiarMedia();
      renderFeed();
    }

    function toggleLike(postId) {
      const posts = getPosts().map(p => {
        if (p.id !== postId) return p;
        const liked = !p.liked;
        return { ...p, liked, likes: Math.max(0, p.likes + (liked ? 1 : -1)) };
      });
      savePosts(posts);
      renderFeed();
    }

    function togglePostMenu(e, postId) {
      e.stopPropagation();
      openMenuId = openMenuId === postId ? null : postId;
      renderFeed();
    }

    function eliminarPost(postId) {
      openMenuId = null;
      savePosts(getPosts().filter(p => p.id !== postId));
      renderFeed();
    }

    document.addEventListener('click', () => {
      if (openMenuId !== null) {
        openMenuId = null;
        renderFeed();
      }
    });

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderFeed() {
      const container = document.getElementById('feedList');
      const posts = getPosts();
      if (!posts.length) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted); font-size:0.85rem;">Aún no hay publicaciones. ¡Comparte tu primer avance!</div>`;
        return;
      }

      container.innerHTML = posts.map(p => {
        const initials = (p.author || 'SF').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
        const isReel = p.format === 'Reel / Clip' || p.mediaType === 'video';
        const mediaHtml = p.mediaUrl
          ? `<div class="post-media-wrap ${isReel ? 'reel-aspect' : ''}">
               ${p.mediaType === 'video'
                 ? `<video src="${p.mediaUrl}" controls playsinline></video>`
                 : `<img src="${p.mediaUrl}" alt="Publicación" />`}
             </div>`
          : '';

        return `
          <article class="card">
            <div class="post-header">
              <div class="post-author-info">
                <div class="avatar-circle">${escapeHTML(initials)}</div>
                <div>
                  <div class="author-name-row">
                    <span class="author-name">${escapeHTML(p.author)}</span>
                    ${p.pro ? `<span class="pro-badge">FUNDADOR</span>` : ''}
                  </div>
                  <div class="post-meta">${escapeHTML(p.handle)} • ${escapeHTML(p.format)} • ${escapeHTML(p.time)}</div>
                </div>
              </div>
              <div class="post-menu-wrap">
                <button type="button" class="post-menu-btn" onclick="togglePostMenu(event, '${p.id}')">⋮</button>
                <div class="post-menu-dropdown ${openMenuId === p.id ? 'open' : ''}" onclick="event.stopPropagation()">
                  <button type="button" class="post-menu-item danger" onclick="eliminarPost('${p.id}')">🗑️ Eliminar post</button>
                </div>
              </div>
            </div>
            ${p.text ? `<p class="post-text">${escapeHTML(p.text)}</p>` : ''}
            ${mediaHtml}
            <div class="post-actions">
              <button type="button" class="action-btn ${p.liked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
                <span>${p.liked ? '🔥' : '🤍'}</span>
                <span>${p.likes}</span>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderTrainers() {
      const list = document.getElementById('trainersList');
      const trainers = leerStorage(STORAGE_KEYS.TRAINERS, TRAINERS_SEED);
      list.innerHTML = trainers.map(t => {
        const initials = t.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
        return `
          <div class="trainer-card">
            <div class="trainer-info">
              <div class="avatar-circle">${escapeHTML(initials)}</div>
              <div>
                <div class="author-name">${escapeHTML(t.name)}</div>
                <div class="post-meta">${escapeHTML(t.handle)} • ${escapeHTML(t.role)}</div>
              </div>
            </div>
            <button type="button" class="btn-header ${t.following ? '' : 'primary'}" onclick="toggleFollow('${t.id}')">
              ${t.following ? 'Siguiendo' : 'Seguir'}
            </button>
          </div>
        `;
      }).join('');
    }

    function toggleFollow(id) {
      const trainers = leerStorage(STORAGE_KEYS.TRAINERS, TRAINERS_SEED).map(t =>
        t.id === id ? { ...t, following: !t.following } : t
      );
      guardarStorage(STORAGE_KEYS.TRAINERS, trainers);
      renderTrainers();
    }

    function simpleHash(text) {
      let h = 2166136261;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return 'e2ee:' + (h >>> 0).toString(16).padStart(8, '0');
    }

    function abrirChatE2EE() {
      document.getElementById('e2eeModal').classList.add('open');
      renderChatE2EE();
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function cerrarModalSiFondo(e, id) {
      if (e.target.id === id) cerrarModal(id);
    }

    function renderChatE2EE() {
      const log = document.getElementById('e2eeLog');
      const msgs = leerStorage(STORAGE_KEYS.CHAT, [
        { sender: 'peer', text: 'Canal cifrado activo en SIGMA FITNESS.' }
      ]);
      log.innerHTML = msgs.map(m => `
        <div class="e2ee-msg ${m.sender === 'me' ? 'me' : 'peer'}">
          <div>${escapeHTML(m.text)}</div>
          <div class="e2ee-hash">${simpleHash(m.text)}</div>
        </div>
      `).join('');
      log.scrollTop = log.scrollHeight;
    }

    function enviarMensajeE2EE(e) {
      e.preventDefault();
      const input = document.getElementById('e2eeInput');
      const text = input.value.trim();
      if (!text) return;
      const msgs = leerStorage(STORAGE_KEYS.CHAT, []);
      msgs.push({ sender: 'me', text });
      guardarStorage(STORAGE_KEYS.CHAT, msgs);
      input.value = '';
      renderChatE2EE();
    }

    (function init() {
      document.getElementById('loginId').value = FOUNDER_ACCOUNT.email;
      document.getElementById('loginPass').value = FOUNDER_ACCOUNT.passwordHash;
      const savedSession = leerStorage(STORAGE_KEYS.SESSION, null);
      if (savedSession) {
        iniciarSesionUsuario(savedSession);
      }
    })();
  </script>
</body>
</html>
