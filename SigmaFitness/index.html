<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigma Fitness | Red Social</title>
  <style>
    :root {
      --crimson: #DC143C;
      --crimson-dark: #9B0D29;
      --crimson-glow: rgba(220, 20, 60, 0.25);
      --bg-main: #09090B;
      --bg-card: #121215;
      --bg-input: #1A1A1E;
      --border-color: #27272A;
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Barra Superior */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: white;
      font-weight: 900;
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      letter-spacing: -1px;
      box-shadow: 0 0 12px var(--crimson-glow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--crimson);
    }

    .btn-biometric {
      background-color: transparent;
      border: 1px solid var(--crimson);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-biometric:hover {
      background-color: var(--crimson);
      box-shadow: 0 0 12px var(--crimson-glow);
    }

    /* Contenedor Principal */
    .container {
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
    }

    /* Banner Eslogan */
    .slogan-banner {
      background: linear-gradient(90deg, rgba(220,20,60,0.15) 0%, rgba(18,18,21,1) 100%);
      border-left: 4px solid var(--crimson);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-main);
    }

    /* Caja para publicar en la red social */
    .post-creator {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .post-creator textarea {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.85rem;
      resize: none;
      height: 85px;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      outline: none;
    }

    .post-creator textarea:focus {
      border-color: var(--crimson);
    }

    .creator-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag-select {
      background-color: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-primary {
      background-color: var(--crimson);
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background-color: var(--crimson-dark);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Feed de Publicaciones */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .post-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--bg-input);
      border: 2px solid var(--crimson);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--crimson);
    }

    .username {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .badge-pro {
      background-color: var(--crimson);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      margin-left: 5px;
      vertical-align: middle;
    }

    .post-tag {
      font-size: 0.75rem;
      color: var(--crimson);
      background-color: var(--crimson-glow);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .post-body {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #E4E4E7;
      margin-bottom: 1rem;
    }

    .post-footer {
      display: flex;
      gap: 1.25rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s;
    }

    .action-btn:hover, .action-btn.liked {
      color: var(--crimson);
    }

    /* Barra de Navegación Inferior */
    nav {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      position: sticky;
      bottom: 0;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }

    .nav-item.active {
      color: var(--crimson);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">SF</div>
      <div class="brand-title">SIGMA <span>FITNESS</span></div>
    </div>
    <button class="btn-biometric" onclick="simularBiometria()">Acceso Biométrico</button>
  </header>

  <div class="container">
    <div class="slogan-banner">
      "Donde la voluntad se convierte en fuerza y la disciplina es innegociable"
    </div>

    <!-- Creador de publicaciones -->
    <div class="post-creator">
      <textarea id="postInput" placeholder="Comparte tu entrenamiento de hoy, marca personal o reflexión..."></textarea>
      <div class="creator-actions">
        <select id="postCategory" class="tag-select">
          <option value="Entrenamiento">Entrenamiento</option>
          <option value="Récord Personal">Récord Personal</option>
          <option value="Nutrición">Nutrición</option>
          <option value="Mentalidad">Mentalidad Sigma</option>
        </select>
        <button class="btn-primary" onclick="crearPublicacion()">Publicar</button>
      </div>
    </div>

    <!-- Feed de la comunidad -->
    <div class="feed" id="feedContainer">
      <div class="post-card">
        <div class="post-header">
          <div class="user-info">
            <div class="avatar">JL</div>
            <div>
              <span class="username">Fundador Sigma <span class="badge-pro">SIGMA PRO</span></span>
            </div>
          </div>
          <span class="post-tag">Mentalidad Sigma</span>
        </div>
        <div class="post-body">
          Bienvenidos a la comunidad oficial de Sigma Fitness. Aquí no venimos a buscar excusas, venimos a construir disciplina real día tras día.
        </div>
        <div class="post-footer">
          <button class="action-btn" onclick="darFuerza(this)">🔥 Fuerza (<span>1</span>)</button>
          <button class="action-btn">💬 Comentar</button>
        </div>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-item active">Comunidad</button>
    <button class="nav-item">Retos</button>
    <button class="nav-item">Sigma Pro</button>
    <button class="nav-item">Perfil</button>
  </nav>

  <script>
    function crearPublicacion() {
      const input = document.getElementById('postInput');
      const category = document.getElementById('postCategory').value;
      const texto = input.value.trim();

      if (!texto) return;

      const feed = document.getElementById('feedContainer');
      const nuevaTarjeta = document.createElement('div');
      nuevaTarjeta.className = 'post-card';

      nuevaTarjeta.innerHTML = `
        <div class="post-header">
          <div class="user-info">
            <div class="avatar">SF</div>
            <div>
              <span class="username">Atleta Sigma <span class="badge-pro">SIGMA PRO</span></span>
            </div>
          </div>
          <span class="post-tag">${category}</span>
        </div>
        <div class="post-body">${texto}</div>
        <div class="post-footer">
          <button class="action-btn" onclick="darFuerza(this)">🔥 Fuerza (<span>0</span>)</button>
          <button class="action-btn">💬 Comentar</button>
        </div>
      `;

      feed.prepend(nuevaTarjeta);
      input.value = '';
    }

    function darFuerza(boton) {
      const span = boton.querySelector('span');
      let conteo = parseInt(span.innerText);
      if (boton.classList.contains('liked')) {
        boton.classList.remove('liked');
        span.innerText = conteo - 1;
      } else {
        boton.classList.add('liked');
        span.innerText = conteo + 1;
      }
    }

    function simularBiometria() {
      alert('Módulo Biométrico (WebAuthn) listo para conectar con Supabase Auth.');
    }
  </script>
</body>
</html>
